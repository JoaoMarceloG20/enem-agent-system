runtime: python311

env_variables:
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  POSTGRES_URL: ${POSTGRES_URL}
  REDIS_URL: ${REDIS_URL}
  QDRANT_URL: ${QDRANT_URL}

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

entrypoint: uvicorn app.main:app --host 0.0.0.0 --port $PORT