[project]
name = "edtech-agent-api"
version = "0.1.0"
description = "Edtech Agent API for ENEM preparation - Multi-agent system using FastAPI and SQLModel"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
    "agno==1.4.6",
    "duckduckgo-search",
    "fastapi[standard]",
    "openai",
    "qdrant-client",
    "psycopg[binary]",
    "sqlmodel<1.0.0,>=0.0.21",
    "uvicorn>=0.35.0",
    "yfinance",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pgvector>=0.4.1",
    "pypdf>=5.9.0",
    "google-genai>=1.28.0",
    "fastembed>=0.7.1",
    "aiohttp>=3.12.15",
]

[tool.uv]
dev-dependencies = [
    "mypy", 
    "ruff",
    "pytest<8.0.0,>=7.4.3",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files
"__init__.py" = ["F401", "F403"]

[tool.mypy]
strict = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "setuptools.*", "nest_asyncio.*", "agno.*"]
ignore_missing_imports = true
